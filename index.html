<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞鸟 · 山水之间</title>
  <meta name="description" content="飞鸟的个人主页 —— 青山流水为幕，收录我的联系方式与作品。">
  <meta name="theme-color" content="#0a1024">
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
  <!-- 分享到微信 / QQ 时显示的卡片信息 -->
  <meta property="og:title" content="飞鸟 · 山水之间">
  <meta property="og:description" content="青山流水为幕，欢迎来找我玩。">
  <meta property="og:image" content="assets/avatar.jpg">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css?v=1.7">
</head>
<body>

  <!-- 动态风景背景：摄影底图 + 雾气/星光/飞鸟/体积光氛围层（昼夜联动，绘于同一画布） -->
  <div class="bg" aria-hidden="true">
    <canvas id="atmosphere"></canvas>
  </div>
  <!-- 萤火虫粒子层 -->
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <!-- ============ 首屏 ============ -->
  <header class="hero">
    <div class="hero-inner">
      <img class="avatar" src="assets/avatar.jpg" alt="飞鸟的头像">
      <h1 class="name">飞鸟</h1>
      <p class="tagline"><span id="typewriter"></span><span class="caret" aria-hidden="true"></span></p>
      <div class="clock-chip">
        <span id="greeting">你好</span>
        <span class="dot">·</span>
        <span id="date"></span>
        <span class="dot dot-time">·</span>
        <span id="time"></span>
      </div>

      <nav class="social-row" aria-label="联系方式">
        <button class="social-btn tint-wechat" data-contact="wechat" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
          <span>微信</span>
        </button>

        <button class="social-btn tint-qq" data-contact="qq" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.078-.132.132-.458-.301-.778-.483-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673"/></svg>
          <span>QQ</span>
        </button>

        <a class="social-btn tint-github" href="https://github.com/hongmortise" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          <span>GitHub</span>
        </a>

        <a class="social-btn tint-x" href="https://x.com/mortiseking" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>
          <span>X</span>
        </a>
      </nav>
    </div>

    <button class="scroll-hint" id="scrollHint" type="button" aria-label="向下滚动查看作品">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5 9 7 7 7-7"/></svg>
    </button>
  </header>

  <!-- ============ 第二屏：作品 ============ -->
  <main>
    <section class="projects" id="projects">
      <h2 class="section-title">作品与折腾</h2>
      <p class="section-sub">一些正在打磨的小东西</p>
      <div class="card-grid">
        <article class="glass-card">
          <div class="card-icon" aria-hidden="true">🏞️</div>
          <h3>个人主页</h3>
          <p>你现在看到的这个页面——青山流水、昼夜更替，纯 HTML / CSS / JS 手写，没有任何框架。</p>
          <a href="https://github.com/hongmortise" target="_blank" rel="noopener">查看我的 GitHub →</a>
        </article>
        <article class="glass-card">
          <div class="card-icon" aria-hidden="true">🚧</div>
          <h3>敬请期待</h3>
          <p>新的项目正在酝酿中，可以去 GitHub 围观我最近在折腾什么。</p>
          <a href="https://github.com/hongmortise" target="_blank" rel="noopener">GitHub 主页 →</a>
        </article>
        <article class="glass-card">
          <div class="card-icon" aria-hidden="true">💬</div>
          <h3>一起搞点事？</h3>
          <p>有有趣的想法随时找我——点页面上方的微信或 QQ 按钮就能联系到我。</p>
          <a href="javascript:void(0)" data-contact-link="wechat">微信我 →</a>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> 飞鸟 · 山水之间</p>
  </footer>

  <!-- ============ 联系方式弹窗 ============ -->
  <div class="modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-mask" data-close></div>
    <div class="modal-card">
      <button class="modal-close" type="button" data-close aria-label="关闭">&times;</button>
      <div class="qr-frame"><img id="modalQr" src="assets/qr-wechat.png" alt="二维码"></div>
      <h3 id="modalTitle">微信</h3>
      <p class="modal-id">账号&nbsp;<code id="modalId"></code></p>
      <button class="copy-btn" id="copyBtn" type="button">复制账号</button>
      <p class="modal-hint" id="modalHint"></p>
    </div>
  </div>

  <!-- 复制成功提示 -->
  <div class="toast" id="toast" role="status"></div>

  <script src="js/bg-data.js?v=1.0"></script>
  <script src="js/background.js?v=2.0"></script>
  <script src="js/fireflies.js?v=1.1"></script>
  <script src="js/main.js?v=1.1"></script>
</body>
</html>
